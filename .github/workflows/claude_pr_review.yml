name: Claude PR Review

on:
  pull_request:
    # `ready_for_review` matters because the job below skips drafts: without it,
    # a PR written entirely in draft would get its first review only on the next
    # push, which may never come.
    types: [opened, synchronize, reopened, ready_for_review]

# A second push while a review is still running supersedes it, but both bill in
# full — several branches here have fired 3-4 overlapping runs. The review is
# idempotent per PR (it re-reads the PR comment for scope), so cancelling the
# older run loses nothing.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # A draft is still being written. Reviewing every push to one pays full price
    # to report findings the author already intends to fix.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Find what (if anything) we already reviewed on this PR. The reviewer is
      # otherwise stateless: it would re-read the whole branch every push, re-raise
      # findings the author already fixed or deliberately declined, and — with the
      # obvious issues gone — keep dredging up progressively more marginal ones.
      #
      # This step also decides two things that only matter to cost, both derived
      # from the file list of the range actually being reviewed:
      #   - whether to run at all (a push touching only generated files can't
      #     produce a finding, but a full run still costs ~$1.40)
      #   - how much reasoning to buy (see the effort note on the Claude step)
      - name: Resolve review scope
        id: scope
        uses: actions/github-script@v7
        env:
          BASE_REF: ${{ github.base_ref }}
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('.claude-review', { recursive: true });

            // Generated or non-executable. The prompt already tells the model to
            // ignore these; the point of listing them again here is to not pay a
            // model run to be told there was nothing to review.
            const IGNORED = [
              /^package-lock\.json$/,
              /^yarn\.lock$/,
              /^pnpm-lock\.yaml$/,
              /^drizzle\/meta\//,
              /\.md$/,
            ];

            // The paths this bot exists for: migrations, schema, the Edge-runtime
            // middleware chain, authorization helpers, and every server-side
            // mutation or API entry point. These keep the full-depth review.
            // Everything else is UI-shaped and reviews fine with less reasoning.
            const HIGH_RISK = [
              /^drizzle\/(?!meta\/)/,
              /^src\/lib\/db\//,
              /^(src\/)?middleware\.ts$/,
              /^src\/lib\/auth/,
              /^src\/actions\//,
              /^src\/app\/api\//,
            ];

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Claude PR Review')
            );

            let previousSha = '';
            if (existing) {
              // Written by the posting step below as: - Commit: `<sha>`
              const m = existing.body.match(/- Commit: `([0-9a-f]{7,40})`/);
              if (m) previousSha = m[1];
              fs.writeFileSync('.claude-review/previous-review.md', existing.body);
            } else {
              fs.writeFileSync('.claude-review/previous-review.md', '');
            }

            // Only treat it as incremental if that commit is actually an ancestor
            // of HEAD — a force-push or rebase makes the old SHA meaningless.
            let incremental = false;
            if (previousSha) {
              try {
                await exec.exec('git', ['merge-base', '--is-ancestor', previousSha, 'HEAD']);
                incremental = true;
              } catch {
                core.info(`Previous SHA ${previousSha} is not an ancestor of HEAD (force-push?) — full review.`);
              }
            }

            core.setOutput('previous_sha', incremental ? previousSha : '');
            core.setOutput('incremental', String(incremental));

            // Classify the range we are about to review — NOT the whole branch.
            // On an incremental run the earlier commits were already reviewed, so
            // a migration back in commit 1 should not force high effort on a
            // commit 9 that only moves a button.
            const range = incremental
              ? `${previousSha}..HEAD`
              : `origin/${process.env.BASE_REF}...HEAD`;

            let files = [];
            try {
              const out = await exec.getExecOutput('git', ['diff', '--name-only', range]);
              files = out.stdout.split('\n').map(s => s.trim()).filter(Boolean);
            } catch (e) {
              // If the range can't be resolved, fail open: review everything at
              // full depth rather than silently skipping a real change.
              core.warning(`Could not list changed files for ${range}: ${e.message}`);
            }

            const reviewable = files.filter(f => !IGNORED.some(re => re.test(f)));
            // Fail open on an empty file list too — that means the git call above
            // failed, not that the PR is empty.
            const skip = files.length > 0 && reviewable.length === 0;
            const highRisk = reviewable.length === 0
              || reviewable.some(f => HIGH_RISK.some(re => re.test(f)));

            core.setOutput('skip', String(skip));
            core.setOutput('effort', highRisk ? 'high' : 'medium');

            core.info(`Range: ${range}`);
            core.info(`Changed: ${files.length}, reviewable: ${reviewable.length}, high-risk: ${highRisk}`);

            if (skip) {
              await core.summary
                .addHeading('Claude PR Review skipped', 3)
                .addRaw('Every changed file in this push is generated or non-executable, so there is nothing for the reviewer to find. The existing review comment is left untouched, and the next push carrying real changes will be reviewed from the last reviewed commit — nothing is dropped.')
                .addList(files)
                .write();
            }

      - name: Run Claude review
        id: claude
        if: steps.scope.outputs.skip != 'true'
        # The action throws when --json-schema is set and the run ends without
        # structured output — which the Agent SDK documents as a normal-ish
        # outcome (the agent just ends its turn). That throw kills the job before
        # the posting step below, so a finished review gets discarded because of
        # how it was packaged. Let the step fail soft; the posting step recovers
        # the review from the execution log and fails the job itself if there is
        # genuinely nothing to post.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The review comes back as structured output, not a file. Asking the model
          # to remember a final Write is the step that kept getting dropped on large
          # branches; --json-schema makes the SDK require the field before the run
          # can end successfully.
          #
          # --effort is set per-PR by the scope step: `high` (the model default, and
          # the setting every review to date has run at) whenever the range touches
          # migrations, schema, middleware, auth, server actions or API routes;
          # `medium` otherwise. Raise the low tier back to `high`, or the high tier
          # to `xhigh`, by editing the scope step — not here.
          #
          # --max-turns is a runaway guard, NOT a cost lever: hitting it aborts the
          # run with an error rather than wrapping up, so it is set well clear of
          # the busiest real review observed (73 turns).
          claude_args: >-
            --model claude-sonnet-5
            --effort ${{ steps.scope.outputs.effort }}
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Bash(git:*)"
            --json-schema '{"type":"object","properties":{"review":{"type":"string","description":"The complete PR review as GitHub-flavored markdown, following the structure in claude_pr_instructions.md. This is posted verbatim as a PR comment."}},"required":["review"]}'
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}")
            on branch ${{ github.head_ref }} -> ${{ github.base_ref }}, authored by ${{ github.event.pull_request.user.login }}.

            You have a full checkout of this repository and may use Read, Grep, Glob,
            and read-only git commands. Use them. You are NOT limited to the diff.

            ## Scope

            Incremental run: ${{ steps.scope.outputs.incremental }}
            Previously reviewed commit: ${{ steps.scope.outputs.previous_sha }}

            If the incremental flag above is `true`:
              - The NEW work to review is: `git diff ${{ steps.scope.outputs.previous_sha }}..HEAD`
              - Everything before that commit was already reviewed in a prior round.
                Read `.claude-review/previous-review.md` for what you said last time.
                Findings there were either fixed or deliberately declined by the author.
                DO NOT re-raise them. If you believe a prior finding was fixed
                incorrectly, say so explicitly and show the code that proves it.
              - Use `git diff origin/${{ github.base_ref }}...HEAD` only as background
                context for understanding the new commits. Do not mine it for new findings.
            Otherwise review the full branch: `git diff origin/${{ github.base_ref }}...HEAD`

            This branch can be large. Do NOT dump the whole diff into context in one
            command — start with `git diff --stat <range>` to see the shape of it, then
            pull per-file diffs (`git diff <range> -- <path>`) for the files that matter
            and Read the surrounding code. A single giant diff crowds out the context you
            need to actually verify findings.

            `git` is the ONLY shell command available to you, and only on its own —
            piping or chaining it (`git diff ... | head`, `git log && cat ...`) is
            denied and wastes a turn. Use Read, Grep and Glob for everything else.

            ## Batch your tool calls

            Every turn replays the whole conversation, so ten Reads in ten turns
            costs far more than the same ten Reads issued together. Whenever you
            know several files or patterns you need and none of them depends on
            another's result, request them ALL in a single message with multiple
            tool calls. Concretely:

            - After `git diff --stat`, fetch the per-file diffs you care about together.
            - Read a file and grep for its callers in the same turn.
            - Verifying three findings means three sets of lookups issued at once,
              not three sequential round-trips.

            Only go one at a time when the next thing you read genuinely depends on
            what the last one said. This is about turn count, not thoroughness —
            do not read fewer files, read them in fewer turns.

            Ignore lockfiles (package-lock.json, yarn.lock, pnpm-lock.yaml) and
            anything under drizzle/meta/ — they are generated.

            ## Verification is mandatory

            You can open any file in this repo, so there is no excuse for a guess.
            Before you report ANY finding, verify it by reading the relevant code.

            - If a finding depends on how a function behaves, READ that function.
            - If it depends on a schema, constraint, or index, READ the schema.
            - If it depends on whether a caller exists, GREP for callers.
            - Then state what you found, citing file:line.

            You may not write a finding containing "depending on how", "if the table
            has", "may be", "worth confirming", "verify that", or any equivalent
            hedge about code you could have read. Either verify it and report it as
            fact, or delete it. A hedged finding costs the author a round-trip to
            disprove and is worse than silence.

            Read the review conventions and the structure to follow in
            `claude_pr_instructions.md`, and the project context in `CLAUDE.md`.

            ## Output

            Return your finished review as markdown in the `review` field of your
            structured output. Do NOT post a comment yourself and do not write it to a
            file — a later workflow step publishes it.

            Emitting that structured output is the LAST thing you do, and it is not
            optional. Do not end your turn with the review as a plain text message —
            a run that ends without structured output is a failed run, no matter how
            good the review was.

            Budget your context so you can still produce that review. If you are running
            low, stop investigating and return the review you have.

      - name: Post review comment
        id: post
        if: steps.scope.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          REVIEW_EFFORT: ${{ steps.scope.outputs.effort }}
        with:
          script: |
            const fs = require('fs');

            let review = '';
            try {
              review = (JSON.parse(process.env.STRUCTURED_OUTPUT || '{}').review || '').trim();
            } catch (e) {
              core.info(`Could not parse structured output: ${e.message}`);
            }

            // The action prints a sanitized result message, so when a run dies the
            // reason is not in the workflow log — only in the execution file. Keep
            // hold of it so a failure says what went wrong instead of just "no output".
            let diagnostic = '';
            // Per-run cost is otherwise buried in the execution log, which makes it
            // invisible in practice. Surfacing it on the comment is what lets anyone
            // notice a review getting more expensive without going digging.
            let costLine = '';

            if (process.env.EXECUTION_FILE) {
              try {
                const log = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8'));
                const messages = Array.isArray(log) ? log : [log];
                const result = messages.find(e => e.type === 'result');

                if (result) {
                  const stats = [
                    `subtype: ${result.subtype}`,
                    `is_error: ${result.is_error}`,
                    `turns: ${result.num_turns}`,
                    `cost: $${result.total_cost_usd ?? 0}`,
                    `duration: ${result.duration_ms}ms`,
                  ].join(', ');
                  const errs = Array.isArray(result.errors) ? result.errors.join('; ') : '';
                  const text = typeof result.result === 'string' ? result.result.trim() : '';
                  diagnostic = [stats, errs, text.slice(0, 800)].filter(Boolean).join('\n');

                  const cost = Number(result.total_cost_usd);
                  costLine = [
                    Number.isFinite(cost) ? `$${cost.toFixed(4)}` : 'cost unavailable',
                    `${result.num_turns ?? '?'} turns`,
                    `${process.env.REVIEW_EFFORT || '?'} effort`,
                  ].join(' · ');
                }

                // Backstops. The action only exposes structured_output when the run
                // ends cleanly AND the field is present; a run that produced a perfectly
                // good review but ended with is_error, or ended its turn as prose instead
                // of structured output, sets nothing. All three still leave the review in
                // the execution log, so dig it out rather than discard a finished review.

                // 1. The schema field is there; only the action's success gate rejected it.
                const fromResult = result?.structured_output?.review;
                if (!review && typeof fromResult === 'string' && fromResult.trim()) {
                  review = fromResult.trim();
                  core.warning('Recovered the review from structured_output in the execution log.');
                }

                // 2. The run's final result text.
                if (!review && typeof result?.result === 'string' && result.result.trim().length > 400) {
                  review = result.result.trim();
                  core.warning('No structured output; recovered the review from the run result text.');
                }

                // 3. The last thing Claude said.
                if (!review) {
                  const texts = messages
                    .filter(e => e.type === 'assistant')
                    .flatMap(e => (e.message?.content ?? []).filter(c => c.type === 'text').map(c => c.text));
                  const last = texts[texts.length - 1]?.trim();
                  if (last && last.length > 400) {
                    review = last;
                    core.warning('No structured output; recovered the review from the final assistant message.');
                  }
                }
              } catch (e) {
                core.info(`Could not read the execution log: ${e.message}`);
              }
            }

            if (!review) {
              const reason = diagnostic
                ? `Claude produced no review. The run reported:\n${diagnostic}`
                : `Claude produced no review and wrote no execution log ` +
                  `(step outcome: ${process.env.CLAUDE_OUTCOME}) — the action failed before Claude started.`;
              core.setOutput('failure_reason', reason);
              await core.summary.addHeading('Claude PR Review failed', 3).addCodeBlock(reason).write();
              core.setFailed(reason);
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Claude PR Review')
            );

            const sha = '${{ github.event.pull_request.head.sha }}';
            const incremental = '${{ steps.scope.outputs.incremental }}' === 'true';
            const previousSha = '${{ steps.scope.outputs.previous_sha }}';

            const scopeNote = incremental
              ? `Reviewed \`${previousSha.slice(0, 7)}..${sha.slice(0, 7)}\` (new commits since the last review).`
              : `Reviewed the full branch.`;

            const body = `## Claude PR Review

            ${review}

            ---
            *Automated review. ${scopeNote} Reply to this comment or use \`@claude\` to ask follow-ups.*

            <details>
            <summary>Review metadata</summary>

            - Commit: \`${sha}\`
            - Reviewed at: ${new Date().toISOString()}
            ${costLine ? `- Run: ${costLine}` : ''}
            </details>`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              console.log('Updated existing review comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new review comment');
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          # Via env, not a ${{ }} interpolation — this string originates from the
          # model and would otherwise be substituted into the script body.
          FAILURE_REASON: ${{ steps.post.outputs.failure_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const reason = (process.env.FAILURE_REASON || '').trim();
            const detail = reason ? `\n\n<details>\n<summary>What the run reported</summary>\n\n\`\`\`\n${reason}\n\`\`\`\n\n</details>` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Failed to generate Claude review. Check the [workflow run](${process.env.RUN_URL}) for details.${detail}`
            });
